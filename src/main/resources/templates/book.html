<!-- Displays the page for a book -->
<!DOCTYPE html>

<!-- Enables Thymeleaf syntax like th:text and th:href -->
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Surf the Library Discovery</title>

  <!-- Bootstrap helps make the page responsive and visually cleaner -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Importing fonts and styling -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
    }

    h1, h2, h3, h4, h5, h6 {
      letter-spacing: -0.03em;
    }

    p {
      font-size: 1rem;
    }

    body {
      background: linear-gradient(180deg, #001b3d 0%, #003b73 45%, #e8f7ff 100%);
      color: #ffffff;
      min-height: 100vh;
    }

    .ocean-nav {
      background-color: rgba(0, 18, 45, 0.95);
      border-bottom: 1px solid rgba(125, 211, 252, 0.25);
    }

    .back-button {
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      color: white;
      padding: 9px 18px;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 24px;
    }

    .back-button:hover {
      background-color: white;
      color: #003b73;
    }

    .discovery-shell {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #002855, #005f99, #00a8cc);
      border-radius: 34px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      padding: 34px;
    }

    .discovery-shell::after {
      content: "";
      position: absolute;
      left: -10%;
      bottom: -75px;
      width: 120%;
      height: 155px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 45%;
      animation: waveMove 7s ease-in-out infinite alternate;
    }

    @keyframes waveMove {
      from {
        transform: translateX(-35px) translateY(5px);
      }
      to {
        transform: translateX(35px) translateY(-8px);
      }
    }

    .discovery-content {
      position: relative;
      z-index: 2;
    }

    .cover-panel {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .book-cover {
      height: 560px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0px 20px 35px rgba(0,0,0,0.5));
    }

    .wave-score {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 10px 18px;
      display: inline-block;
      font-weight: 800;
      color: white;
      margin-top: 16px;
    }

    .info-panel {
      background-color: transparent;
      color: white;
      padding: 20px;
    }

    .simple-label {
      color: #b8e9ff;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .stat-tile {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 18px;
      height: 100%;
      color: white;
    }

    .stat-label {
      color: #b8e9ff;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .stat-tile h3 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .description-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 22px;
      color: white;
    }

    .surf-button {
      background-color: #7dd3fc;
      color: #001b3d;
      border-radius: 999px;
      padding: 10px 18px;
      text-decoration: none;
      display: inline-block;
      font-weight: 800;
    }

    .surf-button:hover {
      background-color: #bae6fd;
      color: #001b3d;
    }

    .wave-divider {
      height: 3px;
      width: 90px;
      background: linear-gradient(90deg, #7dd3fc, #ffffff);
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .mini-caption {
      color: rgba(255,255,255,0.78);
    }

    .soft-text {
      color: rgba(255, 255, 255, 0.78);
    }

    .book-page-title {
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 800;
      line-height: 1.05;
      color: white;
    }
  </style>
</head>

<body>

<!-- Navigation bar shown at the top of the page -->
<nav class="navbar navbar-dark ocean-nav px-4">
  <a class="navbar-brand fw-bold" href="/">Surf the Library</a>
</nav>

<!-- Main page container -->
<div class="container mt-5 mb-5">

  <!-- Allows the user to return to the homepage -->
  <a href="/" class="back-button">
    ← Back to the Library Ocean
  </a>

  <!-- Main discovery section for one book -->
  <div class="discovery-shell">

    <div class="discovery-content">
      <div class="row g-4 align-items-start">

        <!-- Left side shows the book cover-->
        <div class="col-lg-5">
          <div class="cover-panel">

            <p class="simple-label">Current Book</p>

            <!-- Book image -->
            <img th:src="${book.imageUrl}" class="book-cover mb-3">

            <div class="wave-score">
              Wave Score:
              <span th:text="${book.rating}"></span>/5
            </div>

          </div>
        </div>

        <!-- Right side contains the book's report -->
        <div class="col-lg-7">
          <div class="info-panel">

            <!-- Book category -->
            <p class="simple-label">
              Genre: <span th:text="${book.category}"></span>
            </p>


            <!-- Inserts book title -->
            <h1 class="book-page-title mb-3" th:text="${book.title}"></h1>

            <div class="wave-divider"></div>

            <div class="row g-3 mb-4">

              <!-- Price section -->
              <div class="col-md-6">
                <div class="stat-tile">
                  <p class="stat-label">Price</p>
                  <h3>
                    <span th:text="${book.price}"></span>
                  </h3>
                </div>
              </div>

              <!-- Rating section -->
              <div class="col-md-6">
                <div class="stat-tile">
                  <p class="stat-label">Rating</p>
                  <h3>
                    <span th:text="${book.rating}"></span>/5
                  </h3>
                </div>
              </div>

              <!-- Stock section -->
              <div class="col-md-6">
                <div class="stat-tile">
                  <p class="stat-label">Current Status</p>

                  <!-- Conditional statement checks if the book is in stock -->
                  <h3 th:text="${book.inStock ? 'In Stock' : 'Out of Stock'}"></h3>
                </div>
              </div>

              <!-- UPC section -->
              <div class="col-md-6">
                <div class="stat-tile">
                  <p class="stat-label">Book ID</p>

                  <!-- UPC is a unique identifier for every scraped book -->
                  <p class="mb-0" th:text="${book.upc}"></p>
                </div>
              </div>

            </div>

            <!-- Transparent glass style -->
            <div class="description-box mb-4">

              <h5 class="fw-bold mb-3">Book Description</h5>

              <!-- Displays the scraped book description -->
              <p class="mb-0" th:text="${book.description}"></p>

            </div>

            <!-- Opens the original scraped website page in a new tab -->
            <a th:href="${book.productUrl}" target="_blank" class="surf-button">
              View Original Source Listing
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>

</div>

</body>
</html>
